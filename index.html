
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d18">
  <title>CLIPA AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at top, #101d33 0%, #080d18 48%);
      color: #eef4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px 16px;
      padding-top: max(15px, env(safe-area-inset-top));
      border-bottom: 1px solid #202a3d;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(8, 13, 24, .92);
      backdrop-filter: blur(16px);
    }

    .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #48d9f5, #5577ff);
      color: #06111f;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 0 25px #48d9f526;
    }

    header h1 { margin: 0; font-size: 18px; letter-spacing: 1px; }
    header p { margin: 4px 0 0; color: #92a2bd; font-size: 12px; }
    .status { margin-left: auto; color: #65e6bd; font-size: 11px; white-space: nowrap; }

    #newChat {
      background: #152238;
      border: 1px solid #2a3851;
      color: #dce8ff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    main {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 22px 16px;
      padding-bottom: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #chat { display: flex; flex-direction: column; gap: 16px; }

    .welcome { text-align: center; padding: 45px 10px 30px; }
    .welcome h2 { font-size: clamp(26px, 7vw, 36px); margin: 0 0 12px; letter-spacing: -.8px; }
    .welcome p { color: #98a8c2; line-height: 1.7; margin: 0; }

    .message {
      max-width: 92%;
      padding: 13px 15px;
      border-radius: 17px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: appear .18s ease-out;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1a3553, #152943);
      border: 1px solid #2b4a6d;
      border-bottom-right-radius: 6px;
    }

    .assistant {
      align-self: flex-start;
      background: rgba(17, 26, 42, .92);
      border: 1px solid #253149;
      border-bottom-left-radius: 6px;
    }

    .label {
      display: block;
      color: #69dcf3;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: rgba(8, 13, 24, .95);
      border-top: 1px solid #202a3d;
      backdrop-filter: blur(16px);
    }

    form {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 8px;
      border: 1px solid #2a3851;
      border-radius: 19px;
      background: #101827;
      box-shadow: 0 8px 30px #00000020;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 140px;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font: inherit;
      padding: 10px 8px;
    }

    textarea::placeholder { color: #7f8da5; }

    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #send {
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #56d6ef, #79a7ff);
      color: #07121f;
      font-size: 22px;
      font-weight: 800;
      width: 46px;
      height: 44px;
      flex-shrink: 0;
    }

    .hint {
      text-align: center;
      color: #6e7d96;
      font-size: 11px;
      margin: 10px 0 0;
    }

    .error { color: #ffb0b0; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      header { gap: 9px; padding-left: 12px; padding-right: 12px; }
      .logo { width: 38px; height: 38px; }
      header h1 { font-size: 16px; }
      .status { display: none; }
      #newChat { margin-left: auto; padding: 9px; }
      .message { max-width: 96%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">C</div>
    <div>
      <h1>CLIPA AI</h1>
      <p>Your intelligent assistant</p>
    </div>
    <div class="status">● Online</div>
    <button id="newChat" type="button">＋ New chat</button>
  </header>

  <main>
    <div id="chat">
      <section class="welcome" id="welcome">
        <h2>Think bigger. Build anything.</h2>
        <p>Your space to learn, build, and discover.<br>What can I help you with today?</p>
      </section>
    </div>
  </main>

  <div class="composer">
    <form id="form">
      <textarea id="message" rows="1" placeholder="Message CLIPA AI..." aria-label="Your message" required></textarea>
      <button id="send" type="submit" aria-label="Send message">↑</button>
    </form>
    <p class="hint">CLIPA AI can make mistakes. Verify important information.</p>
  </div>

  <script>
    const API_URL = "https://clipa-ai-free.ademrouis.workers.dev/";

    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const chat = document.getElementById("chat");
    const newChatButton = document.getElementById("newChat");

    // Keeps completed messages in memory while this page remains open.
    let conversationHistory = [];

    function showWelcome() {
      const section = document.createElement("section");
      section.className = "welcome";
      section.id = "welcome";

      const title = document.createElement("h2");
      title.textContent = "Think bigger. Build anything.";

      const description = document.createElement("p");
      description.textContent = "Your space to learn, build, and discover.\nWhat can I help you with today?";

      section.appendChild(title);
      section.appendChild(description);
      chat.appendChild(section);
    }

    function addMessage(text, type) {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      const bubble = document.createElement("div");
      bubble.className = "message " + type;

      if (type === "assistant") {
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "CLIPA AI";
        bubble.appendChild(label);
      }

      const content = document.createElement("div");
      content.textContent = text;
      bubble.appendChild(content);
      chat.appendChild(bubble);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return bubble;
    }

    newChatButton.addEventListener("click", () => {
      if (send.disabled) return;

      conversationHistory = [];
      chat.replaceChildren();
      showWelcome();
      input.value = "";
      input.style.height = "auto";
      input.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message || send.disabled) return;

      addMessage(message, "user");

      // Copy completed prior messages for this request.
      const historyForRequest = conversationHistory.map(item => ({ ...item }));

      input.value = "";
      input.style.height = "auto";
      send.disabled = true;
      send.textContent = "…";

      const loading = addMessage("Thinking…", "assistant");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: message,
            history: historyForRequest
          })
        });

        const data = await response.json();
        loading.remove();

        if (!response.ok || !data.reply) {
          throw new Error(data.details || data.error || "Request failed.");
        }

        addMessage(data.reply, "assistant");

        // Save only successful turns for future follow-up questions.
        conversationHistory.push(
          { role: "user", content: message },
          { role: "assistant", content: data.reply }
        );

      } catch (error) {
        loading.remove();
        addMessage("Sorry, I couldn't connect. " + error.message, "assistant error");
      } finally {
        send.disabled = false;
        send.textContent = "↑";
        input.focus();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
