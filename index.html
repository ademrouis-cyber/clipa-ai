
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <title>CLIPA AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b14;
      --panel: #101625;
      --line: rgba(160, 184, 225, .13);
      --muted: #8997b1;
      --text: #edf3ff;
      --cyan: #65e6f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% -18%, rgba(40, 111, 173, .20), transparent 52%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
      padding-top: max(15px, env(safe-area-inset-top));
      background: rgba(8, 11, 20, .86);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .logo {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #06121e;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(140deg, #8af3ff, #55b8f7 55%, #7884ff);
      box-shadow: 0 0 28px rgba(76, 201, 241, .18);
    }

    .brand { min-width: 0; }
    header h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 1.7px;
      font-weight: 800;
    }

    header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8debc8;
      font-size: 11px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #67e8b5;
      box-shadow: 0 0 12px rgba(103, 232, 181, .6);
    }

    main {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 25px 17px 30px;
      flex: 1;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome {
      min-height: 56vh;
      min-height: 56dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 35px 8px;
    }

    .welcome-mark {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border: 1px solid rgba(101, 230, 245, .25);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(101, 230, 245, .13), rgba(101, 125, 255, .09));
      color: var(--cyan);
      font-size: 32px;
      box-shadow: 0 0 60px rgba(53, 166, 220, .10);
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .welcome h2 {
      margin: 0;
      font-size: clamp(30px, 8vw, 43px);
      line-height: 1.13;
      letter-spacing: -1.4px;
      font-weight: 750;
    }

    .welcome h2 span {
      color: transparent;
      background: linear-gradient(90deg, #a0f4ff, #80aaff);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .welcome p {
      max-width: 330px;
      margin: 16px 0 0;
      color: #99a8c1;
      font-size: 14px;
      line-height: 1.8;
    }

    .message {
      max-width: 92%;
      padding: 15px 17px;
      border-radius: 19px;
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: appear .22s ease-out;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(140deg, #18334d, #172741);
      border: 1px solid rgba(100, 190, 239, .22);
      border-bottom-right-radius: 6px;
    }

    .assistant {
      align-self: flex-start;
      max-width: 100%;
      background: linear-gradient(145deg, rgba(20, 29, 47, .96), rgba(14, 21, 35, .96));
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.8px;
      margin-bottom: 9px;
    }

    .label::before {
      content: "✦";
      font-size: 13px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      z-index: 5;
      padding: 13px 15px max(17px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(8, 11, 20, .90), #080b14 25%);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    form {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px;
      border: 1px solid rgba(146, 169, 211, .20);
      border-radius: 22px;
      background: #111827;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .17);
      transition: border-color .2s, box-shadow .2s;
    }

    form:focus-within {
      border-color: rgba(101, 230, 245, .55);
      box-shadow: 0 0 0 3px rgba(101, 230, 245, .055);
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 140px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      padding: 12px 10px;
      caret-color: var(--cyan);
    }

    textarea::placeholder { color: #8290a9; }

    button {
      min-height: 45px;
      min-width: 68px;
      border: 0;
      border-radius: 15px;
      padding: 0 15px;
      background: linear-gradient(135deg, #8af1fb, #57c9ee);
      color: #07121e;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
    }

    button:active { transform: scale(.96); }
    button:disabled { opacity: .55; cursor: wait; }

    .hint {
      margin: 11px 0 0;
      color: #75839d;
      text-align: center;
      font-size: 10px;
      line-height: 1.5;
    }

    .error { color: #ffb4bd; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 700px) {
      header { padding-left: max(24px, calc((100vw - 860px) / 2)); padding-right: max(24px, calc((100vw - 860px) / 2)); }
      main { padding-top: 38px; }
      .message { max-width: 82%; }
      .assistant { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">C</div>
    <div class="brand">
      <h1>CLIPA AI</h1>
      <p>Your intelligent assistant</p>
    </div>
    <div class="status">Online</div>
  </header>

  <main>
    <div id="chat" aria-live="polite" aria-label="Conversation">
      <section class="welcome" id="welcome">
        <div class="welcome-mark" aria-hidden="true">✦</div>
        <div class="eyebrow">Your AI companion</div>
        <h2>Think bigger.<br><span>Build anything.</span></h2>
        <p>Your space to learn, create, and discover. What can I help you with today?</p>
      </section>
    </div>
  </main>

  <div class="composer">
    <form id="form">
      <textarea id="message" rows="1" placeholder="Message CLIPA AI..." aria-label="Your message" required></textarea>
      <button id="send" type="submit">↑</button>
    </form>
    <p class="hint">CLIPA AI can make mistakes. Verify important information.</p>
  </div>

  <script>
    const API_URL = "https://clipa-ai-free.ademrouis.workers.dev/";

    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type) {
      const oldWelcome = document.getElementById("welcome");
      if (oldWelcome) oldWelcome.remove();

      const bubble = document.createElement("div");
      bubble.className = "message " + type;

      if (type === "assistant") {
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "CLIPA AI";
        bubble.appendChild(label);
      }

      const content = document.createElement("div");
      content.textContent = text;
      bubble.appendChild(content);
      chat.appendChild(bubble);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      return bubble;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;

      addMessage(message, "user");
      input.value = "";
      input.style.height = "auto";
      send.disabled = true;
      send.textContent = "…";
      const loading = addMessage("Thinking…", "assistant");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        loading.remove();

        if (!response.ok || !data.reply) {
          throw new Error(data.details || data.error || "Request failed.");
        }

        addMessage(data.reply, "assistant");
      } catch (error) {
        loading.remove();
        addMessage("Sorry, I couldn't connect. " + error.message, "assistant");
      } finally {
        send.disabled = false;
        send.textContent = "↑";
        input.focus();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
