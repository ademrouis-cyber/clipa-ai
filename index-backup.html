<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>CLIPA AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080d18;
      color: #eef4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      border-bottom: 1px solid #202a3d;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      background: #080d18;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #48d9f5, #5577ff);
      color: #06111f;
      font-weight: 900;
      font-size: 20px;
    }
    header h1 { margin: 0; font-size: 19px; letter-spacing: 1px; }
    header p { margin: 4px 0 0; color: #92a2bd; font-size: 12px; }
    .status { margin-left: auto; color: #65e6bd; font-size: 12px; }
    main {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 22px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #chat { display: flex; flex-direction: column; gap: 16px; }
    .welcome { text-align: center; padding: 45px 10px 30px; }
    .welcome h2 { font-size: 29px; margin: 0 0 12px; }
    .welcome p { color: #98a8c2; line-height: 1.6; margin: 0; }
    .message {
      max-width: 90%;
      padding: 13px 15px;
      border-radius: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user {
      align-self: flex-end;
      background: #18304c;
      border: 1px solid #274566;
    }
    .assistant {
      align-self: flex-start;
      background: #111a2a;
      border: 1px solid #253149;
    }
    .label {
      display: block;
      color: #69dcf3;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 16px 18px;
      background: #080d18;
      border-top: 1px solid #202a3d;
    }
    form {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 9px;
      padding: 8px;
      border: 1px solid #2a3851;
      border-radius: 18px;
      background: #101827;
    }
    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 140px;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font: inherit;
      padding: 10px 8px;
    }
    textarea::placeholder { color: #7f8da5; }
    button {
      border: 0;
      border-radius: 13px;
      background: #56d6ef;
      color: #07121f;
      font-weight: 800;
      padding: 0 17px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .hint { text-align: center; color: #6e7d96; font-size: 11px; margin: 10px 0 0; }
    .error { color: #ffb0b0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">C</div>
    <div>
      <h1>CLIPA AI</h1>
      <p>Your intelligent assistant</p>
    </div>
    <div class="status">â Online</div>
  </header>

  <main>
    <div id="chat">
      <section class="welcome" id="welcome">
        <h2>Welcome to CLIPA</h2>
        <p>Your space to learn, build, and discover.<br>What can I help you with today?</p>
      </section>
    </div>
  </main>

  <div class="composer">
    <form id="form">
      <textarea id="message" rows="1" placeholder="Message CLIPA AI..." aria-label="Your message" required></textarea>
      <button id="send" type="submit">Send â</button>
    </form>
    <p class="hint">CLIPA AI can make mistakes. Verify important information.</p>
  </div>

  <script>
    const API_URL = "https://clipa-ai-free.ademrouis.workers.dev/";

    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type) {
      if (welcome) welcome.remove();

      const bubble = document.createElement("div");
      bubble.className = "message " + type;

      if (type === "assistant") {
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "CLIPA AI";
        bubble.appendChild(label);
      }

      const content = document.createElement("div");
      content.textContent = text;
      bubble.appendChild(content);
      chat.appendChild(bubble);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      return bubble;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;

      if (API_URL.includes("PASTE_YOUR_CLOUDFLARE")) {
        addMessage("The website still needs your Cloudflare Worker URL.", "assistant");
        return;
      }

      addMessage(message, "user");
      input.value = "";
      input.style.height = "auto";
      send.disabled = true;
      send.textContent = "...";
      const loading = addMessage("Thinking...", "assistant");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        loading.remove();

        if (!response.ok || !data.reply) {
          throw new Error(data.details || data.error || "Request failed.");
        }

        addMessage(data.reply, "assistant");
      } catch (error) {
        loading.remove();
        addMessage("Sorry, I couldn't connect. " + error.message, "assistant");
      } finally {
        send.disabled = false;
        send.textContent = "Send â";
        input.focus();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
